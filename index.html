<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot Watcher | Admin Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { background-color: #050505; color: white; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        .card { background: #111; border: 1px solid #222; border-radius: 32px; transition: all 0.3s ease; }
        .neon-glow { box-shadow: 0 0 40px rgba(255, 214, 0, 0.07); }
        .input-box { background: #000; border: 1px solid #222; border-radius: 16px; padding: 16px 24px; outline: none; transition: border-color 0.3s; }
        .input-box:focus { border-color: #ffd600; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <!-- LOGIN PANEL -->
    <div id="login_panel" class="card p-12 w-full max-w-md text-center neon-glow">
        <h1 class="text-4xl font-black text-yellow-400 mb-2 tracking-tighter">ADMIN</h1>
        <p class="text-gray-500 mb-8 font-medium">Slot Watcher Command Center</p>
        <div class="space-y-4">
            <input id="adm_user" type="text" placeholder="Username" class="w-full input-box">
            <input id="adm_pass" type="password" placeholder="Password" class="w-full input-box">
            <button onclick="login()" class="w-full bg-yellow-400 text-black font-black py-5 rounded-2xl hover:scale-95 transition active:opacity-80">SIGN IN</button>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard_panel" class="hidden w-full max-w-6xl">
        <div class="flex justify-between items-center mb-12">
            <div>
                <h1 class="text-5xl font-black italic">COMMAND CENTER</h1>
                <p class="text-yellow-400 font-bold tracking-widest uppercase text-xs mt-2">Live App Control Network</p>
            </div>
            <button onclick="location.reload()" class="bg-red-500/10 text-red-500 font-bold px-8 py-3 rounded-full border border-red-500/20">LOGOUT</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- DISPATCHER MODULE -->
            <div class="lg:col-span-2 card p-10 neon-glow">
                <h2 class="text-2xl font-bold mb-8">🚀 Force Update Dispatcher</h2>
                <div class="space-y-8">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div>
                            <label class="text-xs font-black text-gray-600 mb-3 block">TARGET VERSION</label>
                            <input id="new_version" type="text" value="1.1" class="w-full input-box text-2xl font-bold">
                        </div>
                        <div>
                            <label class="text-xs font-black text-gray-600 mb-3 block">APK SERVER URL</label>
                            <input id="new_url" type="text" placeholder="https://..." class="w-full input-box text-sm text-gray-500">
                        </div>
                    </div>
                    <button onclick="pushUpdate()" id="push_btn" class="w-full bg-yellow-400 text-black font-black py-7 rounded-[24px] text-xl hover:shadow-[0_0_50px_rgba(255,214,0,0.2)] transition">PUSH TO ALL PHONES</button>
                    <p class="text-center text-red-500 text-[10px] font-bold tracking-widest">USERS MUST UPDATE TO CONTINUE USING THE APP</p>
                </div>
            </div>

            <!-- TOKEN MODULE -->
            <div class="card p-10">
                <h2 class="text-2xl font-bold mb-8">🔐 Security</h2>
                <div class="space-y-6">
                    <div class="flex gap-2">
                        <input id="token_input" type="text" placeholder="CODE" class="flex-1 input-box font-mono py-3">
                        <button onclick="addToken()" class="bg-white text-black px-6 rounded-2xl font-bold">+</button>
                    </div>
                    <div id="token_list" class="space-y-3 max-h-[300px] overflow-y-auto pr-2">
                        <!-- Tokens Loaded Here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- PASTE YOUR REAL FIREBASE CONFIG HERE ---
        const firebaseConfig = {
            apiKey: "AIzaSyABgjALC0nc-nrnLtdD9ObLxZ2yZBkPSqc",
            authDomain: "slot-watcher-44f23.firebaseapp.com",
            databaseURL: "https://slot-watcher-44f23-default-rtdb.firebaseio.com",
            projectId: "slot-watcher-44f23",
            storageBucket: "slot-watcher-44f23.firebasestorage.app",
            messagingSenderId: "613275783196",
            appId: "1:613275783196:web:65492d2427a1c0d328fd9"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function login() {
            const u = document.getElementById('adm_user').value;
            const p = document.getElementById('adm_pass').value;
            if(u === "nawaz" && p === "ADMIN786") {
                document.getElementById('login_panel').style.display = 'none';
                document.getElementById('dashboard_panel').classList.remove('hidden');
                syncDashboard();
            } else { alert("ACCESS DENIED"); }
        }

        function syncDashboard() {
            db.ref('config').on('value', snap => {
                const data = snap.val();
                if(data) {
                    document.getElementById('new_version').value = data.latest_version;
                    document.getElementById('new_url').value = data.download_url;
                }
            });
            db.ref('tokens').on('value', snap => {
                const list = document.getElementById('token_list');
                list.innerHTML = "";
                snap.forEach(child => {
                    list.innerHTML += `<div class="bg-white/5 p-4 rounded-2xl flex justify-between border border-white/5 animate-fade-in">
                        <span class="font-mono text-yellow-400">${child.key}</span>
                        <button onclick="db.ref('tokens/${child.key}').remove()" class="text-red-500 text-[10px] font-bold hover:text-red-400">REVOKE</button>
                    </div>`;
                });
            });
        }

        function pushUpdate() {
            const v = document.getElementById('new_version').value;
            const u = document.getElementById('new_url').value;
            document.getElementById('push_btn').innerText = "DISPATCHING...";
            db.ref('config').set({ latest_version: v, download_url: u })
            .then(() => {
                alert("SUCCESS: Update Dispatch Complete.");
                document.getElementById('push_btn').innerText = "PUSH TO ALL PHONES";
            });
        }

        function addToken() {
            const t = document.getElementById('token_input').value.toUpperCase();
            if(t) db.ref('tokens/' + t).set(true);
            document.getElementById('token_input').value = "";
        }
    </script>
</body>
</html>
